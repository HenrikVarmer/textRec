[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textrec"
version = "0.1.0"
description = "Recommend unique and novel documents with LDA and Jensen-Shannon divergence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Henrik Varmer", email = "henrik@varmer.dk" }]
keywords = ["recommender", "lda", "topic-model", "jensen-shannon", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/HenrikVarmer/textrec"
Issues = "https://github.com/HenrikVarmer/textrec/issues"
"R version" = "https://github.com/HenrikVarmer/textRec-R"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
